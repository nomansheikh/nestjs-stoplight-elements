name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  # Required to mint the short-lived OIDC token npm exchanges for publish rights.
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    name: Test and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.5
          cache: yarn

      # Staged publishing needs npm >= 11.15.0 and node 24.5 ships 11.5.1.
      # Pinned to the 11 major: npm 12 requires node >= 24.15.0.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Build packages
        run: yarn build

      - name: Test packages
        run: yarn test

      # The trusted publisher grants `npm stage publish` only. This submits the
      # tarball to staging; a maintainer approves it with 2FA to make it public.
      - name: Stage publish to npm
        run: npm stage publish
